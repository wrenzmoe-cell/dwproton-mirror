name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      cflags:
        required: false
        type: string
        default: ''
      rustflags:
        required: false
        type: string
        default: ''
      configure:
        required: false
        type: string
        default: ''
      runner:
        required: false
        type: string
        default: 'ubuntu-latest'
      continue:
        required: true
        type: boolean

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: ${{ inputs.continue }}
    steps:

    - name: Debloat GitHub runner
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: >-
          azure-cli
          google-cloud-cli
          microsoft-edge-stable
          google-chrome-stable
          firefox
          postgresql*
          temurin-*
          *llvm*
          mysql*
          dotnet-sdk-*
        remove_packages_one_command: false
        remove_folders: >-
          /usr/share/swift
          /usr/share/miniconda
          /usr/share/az*
          /usr/local/lib/node_modules
          /usr/local/share/chromium
          /usr/local/share/powershell
          /usr/local/julia
          /usr/local/aws-cli
          /usr/local/aws-sam-cli
          /usr/share/gradle
        testing: false
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Disable git safe.directory check
      run: |
        git config --global --add safe.directory '*'
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/dxvk
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/dxvk-sarek
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/d7vk
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/vkd3d-proton
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/vkd3d-bratan
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/FEX
        git config --global --add safe.directory /home/runner/work/dwproton-mirror/dwproton-mirror/build

    - name: Prepare host
      run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

    - name: Fix directory ownership
      run: |
        sudo chown -R $(whoami):$(whoami) /home/runner/work/dwproton-mirror/dwproton-mirror
        sudo chmod -R u+w /home/runner/work/dwproton-mirror/dwproton-mirror

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure
      working-directory: ./
      env:
        CFLAGS: ${{ inputs.cflags }}
        RUSTFLAGS: ${{ inputs.rustflags }}
        USE_LTO: 0
        GIT_CONFIG_GLOBAL: ~/.gitconfig
        GIT_AUTHOR_NAME: "GitHub Actions"
        GIT_AUTHOR_EMAIL: "actions@github.com"
        GIT_COMMITTER_NAME: "GitHub Actions"
        GIT_COMMITTER_EMAIL: "actions@github.com"
      run: |
        git config --global safe.directory '*'
        sed -i '/check_container_engine() {/,/}/c\check_container_engine() { echo "Bypassing container check"; ROOTLESS_CONTAINER=1; return 0; }' configure.sh
        
        mkdir -p build
        cd build
        
        ../configure.sh \
          --build-name=${{ inputs.name }} \
          --container-engine=docker \
          --docker-opts='--platform linux/arm64 -e GIT_CONFIG_GLOBAL=/tmp/.gitconfig' \
          ${{ inputs.configure }}
        cat Makefile

    - name: Cache identifier
      working-directory: ./build
      id: ccache-id
      run: |
        image=$(make get-steamrt-image | tail -1)
        checksum=$(echo "$image ${{ inputs.cflags }} ${{ inputs.configure }}" | sha1sum | cut -d ' ' -f 1)
        echo "checksum=$checksum" >> $GITHUB_OUTPUT

    - name: Restore cache
      id: ccache-restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ccache-proton-${{ steps.ccache-id.outputs.checksum }}-${{ github.run_id }}
        restore-keys: |
          ccache-proton-${{ steps.ccache-id.outputs.checksum }}
              
    - name: Make ${{ inputs.name }}
      working-directory: ./build
      env:
        GIT_AUTHOR_NAME: "GitHub Actions"
        GIT_AUTHOR_EMAIL: "actions@github.com"
        GIT_COMMITTER_NAME: "GitHub Actions"
        GIT_COMMITTER_EMAIL: "actions@github.com"
      run: |
        make -j2 redist

    - name: Save cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ~/.ccache
        key: ccache-proton-${{ steps.ccache-id.outputs.checksum }}-${{ github.run_id }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}-redist
        path: ./build/redist/
